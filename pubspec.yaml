name: my_first_app
description: "一个基于 Flutter 的电商应用。"
# 防止项目被误发布到 pub.dev。
publish_to: 'none' # 如需发布到 pub.dev，移除这一行。

# 应用版本号与构建号。
# 版本号通常形如 1.2.43，构建号写在 `+` 后面。
# 执行 flutter build 时，可通过命令参数覆盖这两个值。
# Android 中 build-name 对应 versionName，build-number 对应 versionCode。
# iOS 中 build-name 对应 CFBundleShortVersionString，build-number 对应 CFBundleVersion。
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # iOS 风格图标，配合 `CupertinoIcons` 使用。
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  # `tobias` 是支付宝 SDK 的 Flutter 封装，用于接入支付宝支付。
  tobias: ^5.3.4
  # `fluwx` 是微信开放能力封装，包含微信支付、分享、登录等能力。
  fluwx: ^6.0.0
  # `provider` 基于 `ChangeNotifier` + `InheritedWidget` 的轻量状态管理，
  # 用于承载购物车、订单、地址等跨页面共享状态。
  provider: ^6.1.5
  # `dio` 是 Flutter 社区事实标准的网络库（请求/响应拦截器、超时、取消、FormData），
  # 取代自写的 http 薄封装，拦截器能力由它的 Interceptor 体系提供。
  dio: ^5.7.0
  # `shared_preferences` 是 Flutter 官方提供的键值对本地存储插件，
  # 用于持久化登录 token 和设备 clientId，保证冷启动后登录态不丢。
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # `flutter_lints` 提供 Flutter 官方推荐的静态检查规则，
  # 在根目录的 `analysis_options.yaml` 中启用。
  flutter_lints: ^6.0.0

  # `mockito` 是 Dart 社区标准的 Mock 框架，配合 `build_runner` 代码生成，
  # 用 `@GenerateNiceMocks` 声明一次即可为接口/服务类生成 Mock 替身，
  # 取代之前手写的 Fake/Stub（见 `test/helpers/mocks.dart`）。
  mockito: ^5.7.0
  # `build_runner` 是 Dart 官方代码生成器，负责运行 mockito 的 Mock 生成。
  # 生成命令：`dart run build_runner build --delete-conflicting-outputs`
  build_runner: ^2.15.1
  # `patrol` 是 Flutter 原生自动化集成测试框架，基于 integration_test 扩展，
  # 能操作系统权限弹窗、通知等原生 UI，弥补纯 Dart 层集成测试的盲区。
  # 运行 E2E 需要 `patrol_cli`：`flutter pub global activate patrol_cli`
  patrol: ^4.10.0
  # `integration_test` 是 Flutter 官方集成测试框架，E2E 用例运行在真机/模拟器上。
  # 必须以 SDK 依赖方式声明（pub add 会误解析成 pub.dev 同名旧包）。
  integration_test:
    sdk: flutter

flutter:

  # 启用 Material Icons，项目里可直接使用 Material 图标。
  uses-material-design: true

  # 将环境配置 JSON 注册为 Flutter 资源，
  # 便于在纯 Dart 层通过 `rootBundle` 读取，无需改动原生工程。
  assets:
    - assets/config/

tobias:
  # iOS 端支付宝回跳依赖 URL Scheme，这里先放占位值。
  url_scheme: myfirstappalipay

fluwx:
  # 这里仅用于原生工程自动配置占位，
  # 真正的微信 SDK 初始化在 Flutter 代码中显式调用 registerApi。
  app_id: wx1234567890abcdef
  universal_link: https://example.com/wechat/link/
  scene_delegate: true

patrol:
  # Patrol 的应用级配置：E2E 用例所在目录与两端应用标识，
  # `patrol drive` / `patrol test` 会根据这些信息构建并安装应用。
  app_name: my_first_app
  test_directory: integration_test
  android:
    # 对应 android/app/build.gradle.kts 中的 applicationId。
    package_name: com.example.my_first_app
  ios:
    # 对应 ios/Runner.xcodeproj 中的 PRODUCT_BUNDLE_IDENTIFIER。
    bundle_id: com.example.myFirstApp
